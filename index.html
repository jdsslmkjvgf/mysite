<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小小农场餐厅</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>🌾 小小农场餐厅</h1>
    <div class="gold">💰 金币：<span id="gold">0</span></div>

    <section>
      <h2>种子（先选一种，再点空地）</h2>
      <div id="seeds" class="row"></div>
    </section>

    <section>
      <h2>农田</h2>
      <div id="plots" class="grid"></div>
      <button id="buyPlot"></button>
    </section>

    <section>
      <h2>仓库（可直接出售）</h2>
      <div id="inventory"></div>
    </section>

    <section>
      <h2>厨房（做好的菜自动卖给顾客）</h2>
      <div id="recipes"></div>
    </section>

    <p id="msg">点一块空地开始种菜吧！</p>
    <button id="reset" class="small">重置存档</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
